services:
  # Backend Container - Go API Server
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      args:
        - GO_VERSION=1.23
    image: gigabit-backend:latest
    container_name: gigabit-backend
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - DB_PATH=/data/social_network.db
      - PORT=8080
    volumes:
      - backend_data:/data
      - backend_uploads:/root/uploads
    networks:
      - gigabit
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend Container - Next.js Application
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - NODE_VERSION=18
    image: gigabit-frontend:latest
    container_name: gigabit-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8080
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gigabit
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Persistent Volumes
volumes:
  backend_data:
    driver: local
    name: gigabit-backend-data
  backend_uploads:
    driver: local
    name: gigabit-backend-uploads

# Network Configuration
networks:
  gigabit:
    driver: bridge
    name: gigabit-bridge
